name: 更新指標資料

on:
  schedule:
    # 時間是 UTC，台灣時間 = UTC+8；排在前一小時 55 分，整點打開網頁就是剛抓好的
    # 台灣週一到週五 晚上 6:55～凌晨 0:55，每小時一次
    - cron: "55 10-16 * * 1-5"
    # 台灣週二到週六 早上 5:55（美股收盤後）
    - cron: "55 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openpyxl xlrd
      # 每個來源各自獨立：一個失敗不影響其他
      - name: 恐懼與貪婪（CNN）
        run: python scripts/fetch_fng.py
        continue-on-error: true
      - name: Put/Call（CBOE）
        run: python scripts/fetch_putcall.py
        continue-on-error: true
      - name: 基金資金流（ICI）
        run: python scripts/fetch_fundflows.py
        continue-on-error: true
      - name: 台灣融資餘額（證交所）
        run: python scripts/fetch_margin_tw.py
        continue-on-error: true
      - name: 日本融資餘額（JPX）
        run: python scripts/fetch_margin_jp.py
        continue-on-error: true
      - name: 有變動就存回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "資料更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin "$GITHUB_REF_NAME" && git push
