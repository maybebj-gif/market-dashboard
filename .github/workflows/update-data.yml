name: 更新指標資料

on:
  schedule:
    # 時間是 UTC，台灣時間 = UTC+8；整點 GitHub 最塞，所以排在每小時 03 分
    # 台灣週一到週五 晚上 7 點～凌晨 1 點，每小時一次
    - cron: "3 11-17 * * 1-5"
    # 台灣週二到週六 早上 6 點（美股收盤後）
    - cron: "3 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓 Fear & Greed
        run: python scripts/fetch_fng.py
      - name: 有變動就存回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "資料更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
