name: 更新指標資料

on:
  schedule:
    # 美股收盤後（台灣早上）與台灣晚上各一次
    - cron: "20 22 * * 1-5"
    - cron: "20 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓 Fear & Greed
        run: python scripts/fetch_fng.py
      - name: 有變動就存回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "資料更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
